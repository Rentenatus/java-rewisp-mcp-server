# JUnit 5 Platform-Konfiguration für die Test-Suite.
#
# 1. Per-Test-Timeout: Kein Test darf unbeobachtet haengen. Der globale
#    Default gilt fuer alle testfaehigen Methoden (Test- und Lifecycle-
#    Methoden), sofern nicht per @Timeout an der Klasse/Methode
#    ueberschrieben. Langsame Tests (z.B. Maven-Integrationstests)
#    bleiben weit unter dem Default; ein haengender Test schlaegt nach
#    120 s fehl statt den Build zu blockieren.
junit.jupiter.execution.timeout.default = 120 s

# 2. Parallele Ausfuehrung: Klassen parallel, Methoden innerhalb einer
#    Klasse sequenziell (same_thread). Das ist die sichere Variante:
#    - Innerhalb einer Klasse bleiben @BeforeEach-Zustand und
#      Instanzfelder unanhaengig von Parallelitaet.
#    - Klassen-Parallelitaet beschleunigt die Suite deutlich, da die
#      langen Klassen (Maven-/Integrationstests) mit den vielen kurzen
#      Unit-Test-Klassen ueberlappen.
#    - Pool auf 6 begrenzt: mehrfach parallele mvn-Subprozesse und
#      Spoon/OpenRewrite-Modelle wuerden bei 24 Kernen die Maschine
#      nur verwerten, ohne die Wallclock nennenswert zu senken.
#    - Singleton- (EditEventBus) und Timing-sensitive Klassen sind mit
#      @Isolated markiert und laufen ausschliesslich allein.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 6
